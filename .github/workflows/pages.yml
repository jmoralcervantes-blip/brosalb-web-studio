name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar dependencias
        run: bun install --frozen-lockfile || bun install
      - name: Construir versión estática
        run: bunx vite build --config vite.static.config.ts
      - name: Preparar para GitHub Pages
        run: |
          OUT=dist-static
          test -f "$OUT/index.html"
          touch "$OUT/.nojekyll"
          # Las rutas /aviso-legal y /politica-de-privacidad se resuelven en el navegador
          cp "$OUT/index.html" "$OUT/404.html"
          mkdir -p "$OUT/aviso-legal" "$OUT/politica-de-privacidad"
          cp "$OUT/index.html" "$OUT/aviso-legal/index.html"
          cp "$OUT/index.html" "$OUT/politica-de-privacidad/index.html"
          # Cuando tengas dominio, crea public/CNAME con el dominio (por ejemplo brosalb.es)
          ls -la "$OUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
